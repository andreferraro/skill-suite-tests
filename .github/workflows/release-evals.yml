name: Manual release evals

on:
  workflow_dispatch:
    inputs:
      agent:
        description: Agente avaliado.
        required: true
        default: both
        type: choice
        options:
          - codex
          - cursor
          - both
      repetitions:
        description: Uma repetição para diagnóstico; três somente para certificação final.
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "3"
      max_paid_calls:
        description: Confirme o teto total calculado para a combinação escolhida.
        required: true
        default: "12"
        type: choice
        options:
          - "6"
          - "12"
          - "18"
          - "36"
      confirm_paid:
        description: Autorizo esta execução paga dentro do teto informado.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: manual-release-evals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Confirm paid call budget
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.plan.outputs.authorized }}
    steps:
      - id: plan
        name: Validate explicit authorization
        shell: bash
        env:
          SELECTED_AGENT: ${{ inputs.agent }}
          REPETITIONS: ${{ inputs.repetitions }}
          MAX_PAID_CALLS: ${{ inputs.max_paid_calls }}
          CONFIRM_PAID: ${{ inputs.confirm_paid }}
        run: |
          agent_count=1
          if [ "$SELECTED_AGENT" = "both" ]; then agent_count=2; fi
          expected=$((agent_count * 3 * REPETITIONS * 2))
          {
            echo "## Plano de chamadas pagas"
            echo
            echo "Agente: $SELECTED_AGENT"
            echo "Repetições: $REPETITIONS"
            echo "Teto: $expected chamadas de agente"
            echo "Baselines válidos em cache podem reduzir esse total."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "authorized=$CONFIRM_PAID" >> "$GITHUB_OUTPUT"
          if [ "$CONFIRM_PAID" != "true" ]; then
            echo "Prévia concluída. Nenhuma chamada paga foi autorizada."
            exit 0
          fi
          if [ "$MAX_PAID_CALLS" -ne "$expected" ]; then
            echo "Teto inválido: a combinação selecionada exige confirmação de $expected chamadas." >&2
            exit 1
          fi

  codex:
    name: Codex (${{ matrix.case }})
    needs: plan
    if: needs.plan.outputs.authorized == 'true' && (inputs.agent == 'codex' || inputs.agent == 'both')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case: [web-password-reset, api-payment, events-order-consumer]
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_EVAL_MODEL: ${{ vars.CODEX_EVAL_MODEL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Require repository secret
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY"
          test -n "$CODEX_EVAL_MODEL"
      - id: fingerprint
        name: Calculate baseline fingerprint
        shell: bash
        run: |
          value=$(python evals/run_eval.py --agent codex --case "${{ matrix.case }}" --model "$CODEX_EVAL_MODEL" --print-baseline-fingerprint)
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - id: baseline-cache
        name: Restore comparable baseline
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: evals/baseline-cache
          key: baseline-${{ steps.fingerprint.outputs.value }}-r${{ inputs.repetitions }}
      - name: Build isolated agent image
        run: docker build --file evals/agent.Dockerfile --tag skill-suite-tests-eval-agent:local .
      - id: paired
        name: Run release eval within the approved ceiling
        continue-on-error: true
        shell: bash
        run: |
          python evals/run_eval.py \
            --agent codex \
            --case "${{ matrix.case }}" \
            --repetitions "${{ inputs.repetitions }}" \
            --artifacts evals/artifacts \
            --baseline-cache evals/baseline-cache \
            --max-agent-calls "$((2 * ${{ inputs.repetitions }}))" \
            --model "$CODEX_EVAL_MODEL" \
            --agent-container-image skill-suite-tests-eval-agent:local
      - name: Save new comparable baseline
        if: always() && steps.baseline-cache.outputs.cache-hit != 'true' && hashFiles('evals/baseline-cache/**') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: evals/baseline-cache
          key: baseline-${{ steps.fingerprint.outputs.value }}-r${{ inputs.repetitions }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-eval-codex-${{ matrix.case }}
          path: evals/artifacts
          retention-days: 30
      - name: Enforce eval outcome
        if: always()
        shell: bash
        env:
          EVAL_OUTCOME: ${{ steps.paired.outcome }}
        run: test "$EVAL_OUTCOME" = "success"

  cursor:
    name: Cursor (${{ matrix.case }})
    needs: plan
    if: needs.plan.outputs.authorized == 'true' && (inputs.agent == 'cursor' || inputs.agent == 'both')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case: [web-password-reset, api-payment, events-order-consumer]
    env:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      CURSOR_EVAL_MODEL: ${{ vars.CURSOR_EVAL_MODEL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Require repository secret
        shell: bash
        run: |
          test -n "$CURSOR_API_KEY"
          test -n "$CURSOR_EVAL_MODEL"
      - id: fingerprint
        name: Calculate baseline fingerprint
        shell: bash
        run: |
          value=$(python evals/run_eval.py --agent cursor --case "${{ matrix.case }}" --model "$CURSOR_EVAL_MODEL" --print-baseline-fingerprint)
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - id: baseline-cache
        name: Restore comparable baseline
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: evals/baseline-cache
          key: baseline-${{ steps.fingerprint.outputs.value }}-r${{ inputs.repetitions }}
      - name: Build isolated agent image
        run: docker build --file evals/agent.Dockerfile --tag skill-suite-tests-eval-agent:local .
      - id: paired
        name: Run release eval within the approved ceiling
        continue-on-error: true
        shell: bash
        run: |
          python evals/run_eval.py \
            --agent cursor \
            --case "${{ matrix.case }}" \
            --repetitions "${{ inputs.repetitions }}" \
            --artifacts evals/artifacts \
            --baseline-cache evals/baseline-cache \
            --max-agent-calls "$((2 * ${{ inputs.repetitions }}))" \
            --model "$CURSOR_EVAL_MODEL" \
            --agent-container-image skill-suite-tests-eval-agent:local
      - name: Save new comparable baseline
        if: always() && steps.baseline-cache.outputs.cache-hit != 'true' && hashFiles('evals/baseline-cache/**') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: evals/baseline-cache
          key: baseline-${{ steps.fingerprint.outputs.value }}-r${{ inputs.repetitions }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-eval-cursor-${{ matrix.case }}
          path: evals/artifacts
          retention-days: 30
      - name: Enforce eval outcome
        if: always()
        shell: bash
        env:
          EVAL_OUTCOME: ${{ steps.paired.outcome }}
        run: test "$EVAL_OUTCOME" = "success"

  aggregate:
    name: Aggregate manual release gate
    runs-on: ubuntu-latest
    needs: [plan, codex, cursor]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.authorized == 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-eval-*
          path: eval-shards
          merge-multiple: true
      - name: Enforce release gate
        shell: bash
        env:
          SELECTED_AGENT: ${{ inputs.agent }}
          REPETITIONS: ${{ inputs.repetitions }}
        run: |
          args=(
            --input eval-shards
            --output release-eval-summary.json
            --repetitions "$REPETITIONS"
            --case web-password-reset
            --case api-payment
            --case events-order-consumer
          )
          if [ "$SELECTED_AGENT" = "both" ]; then
            args+=(--agent codex --agent cursor)
          else
            args+=(--agent "$SELECTED_AGENT")
          fi
          python evals/aggregate_reports.py "${args[@]}" --enforce-gate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-eval-summary
          path: release-eval-summary.json
          retention-days: 90
