name: Release evals

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-evals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codex:
    name: Codex (${{ matrix.case }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case: [web-password-reset, api-payment, events-order-consumer]
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_EVAL_MODEL: ${{ vars.CODEX_EVAL_MODEL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Require repository secret
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY"
          test -n "$CODEX_EVAL_MODEL"
      - name: Install Codex CLI
        run: npm install --global @openai/codex@0.147.0
      - name: Run paired release eval
        shell: bash
        run: |
          python evals/run_eval.py \
            --agent codex \
            --case "${{ matrix.case }}" \
            --repetitions 3 \
            --artifacts evals/artifacts \
            --model "$CODEX_EVAL_MODEL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-eval-codex-${{ matrix.case }}
          path: evals/artifacts
          retention-days: 30

  cursor:
    name: Cursor (${{ matrix.case }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case: [web-password-reset, api-payment, events-order-consumer]
    env:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      CURSOR_EVAL_MODEL: ${{ vars.CURSOR_EVAL_MODEL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Require repository secret
        shell: bash
        run: |
          test -n "$CURSOR_API_KEY"
          test -n "$CURSOR_EVAL_MODEL"
      - name: Install Cursor Agent CLI
        shell: bash
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run paired release eval
        shell: bash
        run: |
          python evals/run_eval.py \
            --agent cursor \
            --case "${{ matrix.case }}" \
            --repetitions 3 \
            --artifacts evals/artifacts \
            --model "$CURSOR_EVAL_MODEL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-eval-cursor-${{ matrix.case }}
          path: evals/artifacts
          retention-days: 30

  aggregate:
    name: Aggregate release gate
    runs-on: ubuntu-latest
    needs: [codex, cursor]
    if: always()
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-eval-*
          path: eval-shards
          merge-multiple: true
      - name: Enforce release gate
        run: >-
          python evals/aggregate_reports.py
          --input eval-shards
          --output release-eval-summary.json
          --repetitions 3
          --agent codex
          --agent cursor
          --case web-password-reset
          --case api-payment
          --case events-order-consumer
          --enforce-gate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-eval-summary
          path: release-eval-summary.json
          retention-days: 90
